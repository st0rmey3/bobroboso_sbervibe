[project]
name = "docs-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Permissive licenses only (see AGENTS.md §1).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pypdfium2>=4.30",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/File() in defaults is the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
